<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" style="font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2b6cb0; stroke-width: 2; rx:8; }
      .sub { fill: #f7fafc; stroke: #cbd5e1; stroke-width:1; rx:6; }
      .title { font-size:18px; fill:#0b3d91; font-weight:700; }
      .label { font-size:13px; fill:#1f2937; }
      .small { font-size:12px; fill:#374151; }
      .arrow { stroke:#4b5563; stroke-width:2; marker-end: url(#arrowhead); fill:none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="24" y="38" class="title">Architectural Design — System Structure</text>
  <text x="24" y="60" class="small">Frontend, Backend, Processing, Storage, and External Integrations</text>

  <!-- Client / Browser -->
  <g transform="translate(40,100)">
    <rect class="box" width="260" height="90" />
    <text x="16" y="34" class="label">Client / Browser</text>
    <text x="16" y="56" class="small">React SPA (frontend/src)</text>
    <text x="16" y="74" class="small">Static assets served (CDN / backend)</text>
  </g>

  <!-- Frontend stack -->
  <g transform="translate(340,90)">
    <rect class="box" width="380" height="220" />
    <text x="16" y="28" class="label">Frontend</text>
    <g transform="translate(18,42)">
      <rect class="sub" width="340" height="34" />
      <text x="8" y="22" class="small">React 19 • TailwindCSS • Radix UI • Sonner</text>
    </g>
    <g transform="translate(18,82)">
      <rect class="sub" width="340" height="34" />
      <text x="8" y="22" class="small">react-router-dom • react-hook-form • zod</text>
    </g>
    <g transform="translate(18,122)">
      <rect class="sub" width="340" height="34" />
      <text x="8" y="22" class="small">Axios (API client) • jsPDF • craco / Node.js</text>
    </g>
    <g transform="translate(18,162)">
      <rect class="sub" width="340" height="44" />
      <text x="8" y="20" class="small">Major files: frontend/src/* — pages, components, lib/api.js</text>
      <text x="8" y="36" class="small">Build: craco (see frontend/package.json)</text>
    </g>
  </g>

  <!-- Backend -->
  <g transform="translate(40,220)">
    <rect class="box" width="540" height="320" />
    <text x="16" y="28" class="label">Backend</text>

    <g transform="translate(18,44)">
      <rect class="sub" width="240" height="60" />
      <text x="8" y="22" class="small">Django 5 • Django REST Framework</text>
      <text x="8" y="40" class="small">JWT Auth (djangorestframework_simplejwt)</text>
    </g>

    <g transform="translate(280,44)">
      <rect class="sub" width="240" height="60" />
      <text x="8" y="22" class="small">App: `core` (models, views)</text>
      <text x="8" y="40" class="small">Key modules: `upload_views.py`, `gemini_service.py`</text>
    </g>

    <g transform="translate(18,120)">
      <rect class="sub" width="240" height="60" />
      <text x="8" y="22" class="small">OCR & Document Processing</text>
      <text x="8" y="40" class="small">PyMuPDF (fitz) • rapidocr-onnxruntime</text>
    </g>

    <g transform="translate(280,120)">
      <rect class="sub" width="240" height="60" />
      <text x="8" y="22" class="small">AI / LLM Integrations</text>
      <text x="8" y="40" class="small">OpenAI • Google GenerativeAI • Hugging Face • litellm</text>
    </g>

    <g transform="translate(18,196)">
      <rect class="sub" width="240" height="40" />
      <text x="8" y="26" class="small">Storage & Media</text>
    </g>

    <g transform="translate(280,196)">
      <rect class="sub" width="240" height="40" />
      <text x="8" y="26" class="small">DB: Postgres (psycopg2) or SQLite fallback</text>
    </g>

    <text x="20" y="300" class="small">See `backend/requirements.txt` and `backend/acredia/settings.py` for config</text>
  </g>

  <!-- External -->
  <g transform="translate(620,240)">
    <rect class="box" width="520" height="220" />
    <text x="16" y="28" class="label">External Services & Infra</text>
    <g transform="translate(18,46)">
      <rect class="sub" width="480" height="36" />
      <text x="8" y="24" class="small">LLM APIs: OpenAI, Google GenAI, HF Inference</text>
    </g>
    <g transform="translate(18,90)">
      <rect class="sub" width="480" height="36" />
      <text x="8" y="24" class="small">Object Storage: S3 / MinIO (boto3)</text>
    </g>
    <g transform="translate(18,134)">
      <rect class="sub" width="480" height="36" />
      <text x="8" y="24" class="small">OAuth Providers (Google), Supabase hints in env</text>
    </g>
    <g transform="translate(18,178)">
      <rect class="sub" width="480" height="26" />
      <text x="8" y="18" class="small">Health-check plugin, monitoring, external APIs</text>
    </g>
  </g>

  <!-- Arrows -->
  <path d="M300 150 L340 150" class="arrow" />
  <path d="M430 200 L580 200" class="arrow" />
  <path d="M300 260 L300 300" class="arrow" />
  <path d="M580 320 L620 320" class="arrow" />
  <path d="M620 350 L620 380" class="arrow" />

  <!-- Footer note -->
  <text x="24" y="860" class="small">Diagram generated from repository manifests: `frontend/package.json`, `backend/requirements.txt`, `backend/acredia/settings.py`.</text>
</svg>